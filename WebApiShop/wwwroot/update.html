<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8" />
    <title>עדכון פרטי משתמש</title>
    <script src="home.js" defer></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #f7f7f7;
            margin: 0;
        }

        .box {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        input, button {
            display: block;
            margin-bottom: 1vh;
            padding: 0.5rem;
            width: 15rem;
            border: 1px solid #ccc;
            border-radius: 0.3rem;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

            button:hover {
                background-color: #45a049;
            }

        h2 {
            text-align: center;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>עדכון פרטים</h2>

        <label for="userName">אימייל (שם משתמש)</label>
        <input id="userName" type="text">

        <label for="firstName">שם פרטי</label>
        <input id="firstName" type="text">

        <label for="lastName">שם משפחה</label>
        <input id="lastName" type="text">

        <label for="password">סיסמה</label>
        <input id="password" type="password">

        <button onclick="update()">עדכון פרטים</button>
    </div>

    <script>
        window.onload = function () {
            const userData = sessionStorage.getItem('user');

            if (!userData) {
                alert("לא נמצא משתמש מחובר. חוזרים לדף התחברות.");
                window.location.href = "home.html";
                return;
            }

            const user = JSON.parse(userData);

            document.getElementById("userName").value = user.email || user.Email || user.userName || "";
            document.getElementById("firstName").value = user.firstName || user.FirstName || "";
            document.getElementById("lastName").value = user.lastName || user.LastName || "";
            document.getElementById("password").value = user.password || user.Password || "";
        };
    </script>
</body>
</html>
